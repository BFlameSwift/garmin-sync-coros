name: garmin-sync-coros

on:
  schedule:
    - cron: '0 1,8,21 * * *'
  workflow_dispatch:
    inputs:
      newest_num:
        description: 'Maximum Garmin activities to inspect (0 means all pages)'
        required: false
        default: '10000'
        type: string
      sync_limit:
        description: 'Maximum activities to process in this run'
        required: false
        default: '10000'
        type: string
env:
  ## 佳明配置
  GARMIN_AUTH_DOMAIN: ${{ secrets.GARMIN_AUTH_DOMAIN }}
  GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
  GARMIN_NEWEST_NUM: ${{ inputs.newest_num || secrets.GARMIN_NEWEST_NUM || '10000' }}
  SYNC_LIMIT: ${{ inputs.sync_limit || '10000' }}

  ## Coros配置
  COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
  COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: garmin-sync-coros
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Garmin Sync
        run: |
          python scripts/garmin/garmin_sync_coros.py
      - name: Push new cookie
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          for path in db garmin-fit coros-fit; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'chore(sync): persist sync state'
            git push
          fi
